<!DOCTYPE html>
<html>
<head>
    <title>Actual Result - Decision Diary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <div class="logo">🧠 Decision Diary</div>
    <div><a href="/">Home</a></div>
</nav>

<main class="form-container">
    <div class="form-header">
        <p class="tag">STEP 2</p>
        <h1>What Actually Happened?</h1>
        <p>You predicted: <strong>{{ decision.expected_time }} days</strong></p>
    </div>

    <form method="POST" class="form-card">
        <label>Actual Outcome</label>
        <textarea name="actual_outcome" placeholder="Example: I completed the project, but testing took longer than expected." required></textarea>

        <label>Actual Time (days)</label>
        <input type="number" name="actual_time" min="0.1" step="0.1" required>

        <label>Did the decision work out?</label>
        <div class="radio-group">
            <label class="radio">
                <input type="radio" name="success" value="yes" required>
                Yes
            </label>
            <label class="radio">
                <input type="radio" name="success" value="no">
                No
            </label>
        </div>

        <button class="btn full" type="submit">Compare With My Prediction</button>
    </form>
</main>
</body>
</html>
